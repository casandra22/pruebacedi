name: Actualizar Novedades

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [novedades-updated]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generar y subir novedades (con reintento si otra corrida se adelantó)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3 4 5; do
            node scripts/build-novedades.mjs
            if [ -z "$(git status --porcelain novedades.html index.html assets/img)" ]; then
              echo "Sin cambios en las novedades."
              exit 0
            fi
            git add novedades.html index.html assets/img
            git commit -m "Actualizar novedades desde Google Sheets"
            if git push; then
              echo "Push exitoso."
              exit 0
            fi
            echo "Intento $intento: otra corrida subió cambios primero, reintento desde el estado actual del repo."
            sleep $((RANDOM % 5 + 2))
            git fetch origin main
            git reset --hard origin/main
          done
          echo "No se pudo subir después de varios intentos."
          exit 1
